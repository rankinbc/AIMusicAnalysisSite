# Spectr CI — clean-checkout verification (story 1.2, NFR28, AR39).
#
# FROZEN-V1 EXCLUSION (intentional — do not "fix"):
#   components/api, components/frontend, components/frontend-spectr are
#   frozen v1 components (AR3). They are excluded from every gate here and
#   from deploys; new code never imports them (enforced by
#   components/worker/tests/test_frozen_v1_boundary.py). The api test suite
#   is intentionally import-broken since the story-1.1 pipeline relocation.
#
#   components/analysis IS gated (added 2026-07-02, production-readiness
#   sweep): base install only — the [ml] extra (torch/demucs) stays out;
#   its tests mock the heavy models.
#
# Python deps are pinned via components/worker/requirements.lock.txt
# (uv pip compile of components/worker/requirements.in — union of
# worker + shared + analysis runtime deps). Installs pass it as a
# constraints file so CI resolves the same versions as prod images.

name: ci

# paths-ignore covers PRPs/ planning docs ONLY — a global "**.md" ignore
# would also skip CI for worker prompt files (functional .md with versioned
# frontmatter, exercised by the worker test suite).
on:
  push:
    paths-ignore:
      - "PRPs/**"
  pull_request:
    paths-ignore:
      - "PRPs/**"

# One run per ref: an open PR makes every push fire push + pull_request
# events; superseded runs are cancelled instead of stacking.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Story 4.1 (AC4/NFR6): secret scan over working tree + full git history.
  # Known dev/test fakes are allowlisted in .gitleaks.toml — anything new
  # that trips a rule fails the build. Built-IMAGE scanning is deferred to
  # story 10.1 (CI builds no images today; compose builds are local-only).
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # scan full history, not just the tip
      - name: Run gitleaks
        run: |
          GITLEAKS_VERSION=8.24.3
          # Pinned by checksum — release assets are mutable; the secret-scan
          # job must not itself be a supply-chain hole.
          GITLEAKS_SHA256=9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks detect --source . --config .gitleaks.toml --redact -v

  bff:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: components/bff
    # Story 12.7 (AC1/AC4): real Postgres + Redis so the integration suite
    # EXECUTES in CI. Before this, every DB test silently no-op'd (early
    # return on unreachable DB) and 5 host-boot tests failed on Redis —
    # green here meant "it compiled". Versions match docker/docker-compose.yml.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: spectr
          POSTGRES_PASSWORD: spectr
          POSTGRES_DB: spectr
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U spectr"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: components/bff/global.json
      - name: Build
        run: dotnet build
      # Development env: dotnet-ef boots Program, and non-Development boot
      # refuses to start without real signing keys (story 4.1) — dev keys
      # live in appsettings.Development.json. Connection string default is
      # already localhost:5432 spectr/spectr (appsettings.json).
      - name: Apply EF migrations
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ConnectionStrings__Postgres: "Host=localhost;Port=5432;Database=spectr;Username=spectr;Password=spectr"
        run: |
          # dotnet-ef pinned to the EF Core major in use — an unpinned latest
          # can break this step with zero repo changes (same rationale as the
          # pinned ruff/mypy below).
          dotnet tool install --global dotnet-ef --version "10.*"
          dotnet ef database update --project src/Spectr.Data --startup-project src/Spectr.Bff
      # SPECTR_REQUIRE_DB=1 arms the fail-loud tripwire: an unreachable DB is
      # a FAILURE here (TestDb.RequireAsync + CiDbCanaryTests), never a skip.
      - name: Test
        env:
          SPECTR_REQUIRE_DB: "1"  # exact value "1" arms the fail-loud tripwire
          # Explicit, not inherited from the appsettings.json default — a
          # future default change must not silently detach CI from its DB.
          ConnectionStrings__Postgres: "Host=localhost;Port=5432;Database=spectr;Username=spectr;Password=spectr"
        run: dotnet test --no-build

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: components/frontend-spectr-v2
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: components/frontend-spectr-v2/package-lock.json
      - name: Install
        run: npm ci
      # vite build MUST precede tsc -b: src/routeTree.gen.ts is gitignored
      # and generated by the TanStack router vite plugin (AC2).
      - name: Build (generates routeTree.gen.ts)
        run: npx vite build
      - name: Type-check
        run: npx tsc -b
      - name: Lint
        run: npm run lint
      - name: Lint — no raw hex in CSS modules (AR39)
        run: npm run lint:css
      - name: Lint — no price literals outside config (AR39)
        run: npm run lint:prices
      - name: Unit tests
        run: npx vitest run

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install (shared editable first — aimusic-shared is not on PyPI)
        run: |
          pip install -e components/shared -c components/worker/requirements.lock.txt
          pip install -e components/analysis -c components/worker/requirements.lock.txt
          # ruff/mypy pinned to locally-verified versions — unpinned latest
          # can redden CI with zero repo changes (new default rules).
          pip install -r components/worker/requirements.txt -c components/worker/requirements.lock.txt "ruff~=0.15.11" "mypy~=1.20"
      - name: Ruff
        run: ruff check components/worker/ components/shared/ components/analysis/src/
      - name: Worker tests (golden fixtures + boundary + enforcement lints)
        run: python -m pytest -q tests/
        working-directory: components/worker
      - name: Shared tests
        run: python -m pytest -q components/shared/tests/
      - name: Analysis tests (heavy models mocked; no [ml] extra installed)
        run: python -m pytest -q components/analysis/tests/
      - name: Mypy (relocated pipeline)
        run: python -m mypy app/verdict_lib/ --ignore-missing-imports
        working-directory: components/worker

  # ── Story 10.1 (AR30/AC3): master-only — build+push GHCR, trivy-scan the
  # BUILT images (the 4.1 deferral lands here), SSH deploy + /healthz smoke.
  # The SSH step skips gracefully when the VPS secrets aren't configured, so
  # the pipeline is green before a VPS exists.
  deploy:
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    needs: [secrets, bff, frontend, python]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # One deploy at a time, in order — concurrent master merges must not
    # interleave pulls/state writes on the VPS.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # SCAN BEFORE PUSH: a CRITICAL-vuln image must never overwrite
      # :latest in the registry. Build locally (load), trivy, then push.
      - name: Build spectr-bff (local)
        uses: docker/build-push-action@v6
        with:
          context: components/bff
          file: components/bff/src/Spectr.Bff/Dockerfile
          load: true
          tags: ghcr.io/${{ github.repository_owner }}/spectr-bff:${{ github.sha }}
      - name: Build spectr-worker (local)
        uses: docker/build-push-action@v6
        with:
          context: components
          file: components/worker/Dockerfile
          load: true
          tags: ghcr.io/${{ github.repository_owner }}/spectr-worker:${{ github.sha }}
      - name: Build spectr-web (local)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile.web
          load: true
          build-args: |
            VITE_SENTRY_DSN=${{ secrets.VITE_SENTRY_DSN }}
            VITE_POSTHOG_KEY=${{ secrets.VITE_POSTHOG_KEY }}
          tags: ghcr.io/${{ github.repository_owner }}/spectr-web:${{ github.sha }}

      # Built-image scanning (story 4.1 deferral lands here): CRITICAL
      # vulns fail the deploy; unfixed-upstream noise ignored.
      - name: Trivy scan spectr-bff
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/spectr-bff:${{ github.sha }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Trivy scan spectr-worker
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/spectr-worker:${{ github.sha }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Trivy scan spectr-web
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/spectr-web:${{ github.sha }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Push images (post-scan)
        run: |
          set -euo pipefail
          for img in spectr-bff spectr-worker spectr-web; do
            ref="ghcr.io/${{ github.repository_owner }}/$img"
            docker tag "$ref:${{ github.sha }}" "$ref:latest"
            docker push "$ref:${{ github.sha }}"
            docker push "$ref:latest"
          done

      - name: Deploy over SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          if [ -z "$VPS_HOST" ] || [ -z "$VPS_USER" ] || [ -z "$VPS_SSH_KEY" ]; then
            echo "VPS secrets not configured — images pushed, deploy skipped."
            exit 0
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$VPS_HOST" > ~/.ssh/known_hosts || { echo "!! ssh-keyscan failed" >&2; exit 1; }
          # Ship the infra bundle (self-updating compose/Caddyfile/deploy.sh),
          # then pin + pull + up + health verify (deploy.sh auto-rolls-back).
          scp -i ~/.ssh/deploy_key infra/compose.prod.yml infra/deploy.sh infra/backup.sh infra/restore-test.sh "$VPS_USER@$VPS_HOST:/opt/spectr/"
          scp -r -i ~/.ssh/deploy_key infra/prometheus infra/grafana "$VPS_USER@$VPS_HOST:/opt/spectr/"
          ssh -i ~/.ssh/deploy_key "$VPS_USER@$VPS_HOST" \
            "chmod +x /opt/spectr/deploy.sh /opt/spectr/backup.sh /opt/spectr/restore-test.sh && /opt/spectr/deploy.sh ${{ github.sha }}"
