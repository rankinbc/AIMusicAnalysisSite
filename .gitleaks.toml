# Story 4.1 (AC4/NFR6) — gitleaks config for the CI `secrets` job.
# Default ruleset applies; this file only allowlists the KNOWN FAKES the
# repo deliberately contains (test fixtures + dev-compose credentials).
# Review-hardened: every regex is ANCHORED against the detected SECRET
# (regexTarget=secret) so a real credential merely CONTAINING one of these
# substrings still fails CI. Path exclusions are specific files, never
# whole trees. Anything new that trips a rule fails the build.

title = "SPECTR secret scan"

[extend]
useDefault = true

[allowlist]
description = "Known dev/test fakes — placeholders only, never real credentials"
regexTarget = "secret"
regexes = [
  # Stripe test fixtures used across BFF billing tests + docs (exact values)
  '''^sk_test_(fake|unit|x|4eC39HqLyjWDarjtT1zdp7dc)$''',
  '''^whsec_(unit|test_secret(_do_not_use_in_prod)?)$''',
  # 4.2 EmailPipelineTests svix fixture (base64 of "test-secret-for-unit-tests")
  '''^whsec_dGVzdC1zZWNyZXQtZm9yLXVuaXQtdGVzdHM=$''',
  '''^sk_test_<[^>]+>$''',
  '''^whsec_<[^>]+>$''',
  # Dev compose / MinIO / worker credentials (documented dev-only, exact)
  '''^minioadmin$''',
  '''^spectr-worker-secret$''',
  '''^spectr-compose-dev-anon-signing-key-0123456789$''',
  # appsettings/dev placeholders (exact, or documented dev-only prefixes)
  '''^REPLACE_ME[A-Z_]*$''',
  '''^REPLACE_WITH_32_PLUS_RANDOM_BYTES[A-Z_]*$''',
  '''^spectr-dev-only-[a-z-]+$''',
  '''^dev-anon-signing-key-change-in-prod$''',
  '''^change-me-in-production$''',
  '''^price_test_(monthly|annual)_REPLACE_IN_DEV_SECRETS$''',
  # Test-fixture signing key (SpinePrimitivesTests) — obviously fake
  '''^test-anon-signing-key-0123456789$''',
]
paths = [
  # Frozen v1 (AR3) — excluded from CI/deploy; its .env.example holds
  # legacy placeholder names that pattern-match generic rules.
  '''components/api/\.env\.example''',
  # ONE story doc whose prose ("key shapes per kind…") trips generic-api-key
  # in a historical commit. Deliberately NOT a blanket PRPs/ exclusion —
  # planning docs are exactly where secrets get pasted by accident.
  '''PRPs/stories/3-2-worker-side-validation-and-attachments-via-r2\.md''',
  # Vendored/lock artifacts
  '''package-lock\.json''',
  '''requirements\.lock\.txt''',
]
