[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "audio-analysis"
version = "0.1.0"
description = "7-phase audio analysis pipeline for AI Music Analyzer"
requires-python = ">=3.11"
dependencies = [
    "librosa>=0.11,<1.0",
    "soundfile",
    "scipy",
    "numpy<2.0",
    "pyloudnorm",
    "scikit-learn",
    "rapidfuzz>=3.0",
    "Pillow>=10,<12",
]

[project.optional-dependencies]
ml = [
    "demucs>=4.0",
    "torch>=2.0",
    "torchaudio",
    "torchopenl3",
]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "mypy",
]

[tool.hatch.build.targets.wheel]
packages = ["src/audio_analysis"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
