server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA fallback — TanStack Router needs all unknown paths to serve index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Story 7.2 — share links: crawlers (Discord/Slack/Twitter/…) get the BFF's
  # prerendered OG shell so the link unfurls; humans get the SPA. `if` inside
  # location with a URI-less proxy_pass is the sanctioned nginx pattern here.
  location /r/ {
    if ($http_user_agent ~* (discordbot|slackbot|twitterbot|facebookexternalhit|whatsapp|telegrambot|linkedinbot|googlebot|bingbot|embedly|pinterest|skypeuripreview)) {
      proxy_pass http://bff:5000;
    }
    try_files $uri /index.html;
  }

  # Proxy /api to the BFF — service name from docker-compose.
  location /api/ {
    proxy_pass http://bff:5000/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_buffering off;          # required for SSE
    proxy_read_timeout 86400;
  }
}
