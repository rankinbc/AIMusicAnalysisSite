[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aimusic-shared"
version = "0.1.0"
description = "Shared SQLAlchemy ORM models for AI Music Analyzer — single source of truth for DB schema"
dependencies = [
    "sqlalchemy>=2.0.0",
    "psycopg2-binary",
    "python-ulid>=2.2",
    "pydantic>=2.7,<3",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["aimusic_shared*"]
