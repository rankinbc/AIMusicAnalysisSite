services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: spectr
      POSTGRES_USER: spectr
      POSTGRES_PASSWORD: spectr
    ports:
      - "5432:5432"
    volumes:
      # postgres_data_16: fresh volume for postgres:16 — the original
      # `postgres_data` volume was initialized by PG15 (v1 era) and is
      # incompatible; it is intentionally left in place, unused.
      # To reclaim it once you're sure nothing in it is needed:
      #   docker volume rm docker_postgres_data
      # (or dump first: run a postgres:15 container mounting it + pg_dumpall)
      - postgres_data_16:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spectr"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Story 3.1 (AR17): S3-compatible object storage for presigned multipart
  # uploads — MinIO in dev/CI, Cloudflare R2 in prod (same code path).
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot bucket bootstrap: creates the `spectr` bucket and applies the
  # CORS rule the browser-direct flow REQUIRES (FOOTGUN #2: without
  # ExposeHeaders ETag the browser cannot read per-part ETags and multipart
  # Complete is impossible).
  minio-init:
    image: minio/mc
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/spectr &&
      printf '<CORSConfiguration><CORSRule><AllowedOrigin>http://localhost:5174</AllowedOrigin><AllowedMethod>PUT</AllowedMethod><AllowedMethod>GET</AllowedMethod><AllowedMethod>HEAD</AllowedMethod><AllowedHeader>*</AllowedHeader><ExposeHeader>ETag</ExposeHeader><MaxAgeSeconds>3600</MaxAgeSeconds></CORSRule></CORSConfiguration>' > /tmp/cors.xml &&
      mc cors set local/spectr /tmp/cors.xml &&
      echo 'minio bucket + CORS ready'
      "

  # C# BFF — owns auth, library, user state, queue dispatch, audio streaming.
  bff:
    build:
      context: ../components/bff
      dockerfile: src/Spectr.Bff/Dockerfile
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    environment:
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=spectr;Username=spectr;Password=spectr"
      Redis__ConnectionString: "redis:6379"
      Jwt__Key: "${JWT_KEY:?Set JWT_KEY in your shell or .env (32+ random bytes)}"
      Jwt__Issuer: "spectr.bff"
      Jwt__Audience: "spectr.web"
      Storage__Provider: "local"
      Storage__LocalRoot: "/data"
      # Story 3.1: presigned multipart via MinIO (AR17). Browser PUTs go to
      # localhost:9000 so the presign endpoint must be the HOST-visible URL,
      # not the compose-internal one — the signature bakes in the host.
      Storage__S3__ServiceUrl: "http://localhost:9000"
      Storage__S3__AccessKey: "minioadmin"
      Storage__S3__SecretKey: "minioadmin"
      Storage__S3__Bucket: "spectr"
      Storage__S3__Region: "us-east-1"
      Storage__S3__ForcePathStyle: "true"
      ASPNETCORE_ENVIRONMENT: "Development"
    ports:
      - "5000:5000"
    volumes:
      - ../data:/data

  # Python analysis worker — dramatiq consumer; runs the 7-phase pipeline +
  # the 26 specialists + waveform peaks pre-compute + coach_reply (story 1.5).
  # Queues consumed: `default` + `coach` (the Procfile is the canonical
  # entrypoint; if/when this service is rebuilt in docker, the Dockerfile
  # CMD must mirror the Procfile's --queues default coach).
  worker:
    build:
      context: ../components/worker
      dockerfile: Dockerfile
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    environment:
      DATABASE_URL: "postgresql+asyncpg://spectr:spectr@postgres:5432/spectr"
      REDIS_URL: "redis://redis:6379/0"
      TORCH_HOME: "/data/models"
      # LLM gateway (story 1.3): fake by default so the dev stack needs no key.
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      LLM_FAKE: "${LLM_FAKE:-1}"
      # Story 3.1: fetch presigned-uploaded sources from MinIO (compose-internal host).
      S3_ENDPOINT: "http://minio:9000"
      S3_ACCESS_KEY: "minioadmin"
      S3_SECRET_KEY: "minioadmin"
      S3_BUCKET: "spectr"
      S3_REGION: "us-east-1"
    volumes:
      - ../data:/data
      - ../components/analysis:/app/analysis
      - ../components/shared:/app/shared

  # React frontend — served via nginx in prod; for dev, run `npm run dev` outside the compose.
  frontend:
    build:
      context: ../components/frontend-spectr-v2
      dockerfile: Dockerfile
    depends_on:
      bff: { condition: service_started }
    ports:
      - "5174:80"

volumes:
  postgres_data_16:
  minio_data:
