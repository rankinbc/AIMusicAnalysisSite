# Story 10.1 (AR29) — THE production stack. Lives at /opt/spectr on the VPS
# next to a chmod-600 .env (AR31) and .deploy-state (deploy.sh's tag pins).
#
#   docker compose -f compose.prod.yml up -d
#
# Only caddy publishes ports — the BFF is reachable exclusively through it,
# which is what makes ForwardedHeaders:Enabled safe (no direct spoof path).
# Supersedes docker/docker-compose.prod.yml's queue-split overlay (that
# overlay remains for DEV prod-parity runs).
#
# Required in .env (see .env.example): SPECTR_DOMAIN, JWT_KEY,
# ANON_SIGNING_KEY, POSTGRES_PASSWORD, R2_*, RESEND_* (incl. RESEND_FROM),
# Stripe keys, ANTHROPIC_API_KEY. IMAGE_TAG is managed by deploy.sh (env
# var, not .env); App__FrontendOrigin derives from SPECTR_DOMAIN below.

# Bounded container logs on a single VPS — unrotated json-file logs are the
# classic slow-motion full-disk outage.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  caddy:
    image: ghcr.io/rankinbc/spectr-web:${IMAGE_TAG:?set by deploy.sh}
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3 — caddy advertises h3; unmapped UDP = silent QUIC timeouts
    environment:
      SPECTR_DOMAIN: "${SPECTR_DOMAIN:?}"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      bff: { condition: service_started }

  bff:
    image: ghcr.io/rankinbc/spectr-bff:${IMAGE_TAG:?}
    restart: unless-stopped
    logging: *default-logging
    volumes:
      # IFileStorage is LocalDisk-backed for legacy/auxiliary writes even in
      # prod (the presigned R2 path is primary; an S3-backed IFileStorage is
      # a 10.x follow-up) — persist it, don't let it die with the container.
      # Shared with worker-paid/worker-free (same host path) so anon/legacy
      # proxy uploads written here are visible to the worker's pipeline.
      - /opt/spectr/data:/data
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=spectr;Username=spectr;Password=${POSTGRES_PASSWORD:?}"
      Redis__ConnectionString: "redis:6379"
      Jwt__Key: "${JWT_KEY:?}"
      Jwt__Issuer: "spectr.bff"
      Jwt__Audience: "spectr.web"
      Anon__SigningKey: "${ANON_SIGNING_KEY:?}"
      # Story 10.1: migrations at boot under advisory lock (AC2) + proxy
      # header trust (caddy is the only ingress) + hard origin requirement.
      Migrations__ApplyAtBoot: "true"
      ForwardedHeaders__Enabled: "true"
      # Story 10.3 — optional; empty disables Sentry entirely.
      Sentry__Dsn: "${SENTRY_DSN_BFF:-}"
      # Story 10.5 — optional; unset = the /api/admin surface 404s.
      Admin__ApiKey: "${ADMIN_API_KEY:-}"
      App__FrontendOrigin: "https://${SPECTR_DOMAIN:?}"
      # Object storage = Cloudflare R2 (S3 API). Local root backs the
      # residual IFileStorage writes (volume above).
      Storage__Provider: "local"
      Storage__LocalRoot: "/data"
      Storage__S3__ServiceUrl: "${R2_ENDPOINT:?}"
      Storage__S3__AccessKey: "${R2_BFF_ACCESS_KEY:?}"
      Storage__S3__SecretKey: "${R2_BFF_SECRET_KEY:?}"
      Storage__S3__Bucket: "${R2_BUCKET:-spectr}"
      Storage__S3__Region: "auto"
      # S3StorageOptions doc: "MinIO REQUIRES true; R2 must stay FALSE."
      Storage__S3__ForcePathStyle: "false"
      # Prod boot gates (4.1/4.2): missing billing/email config refuses boot.
      # Stripe relaxed to optional for the single-VM demo deploy: compose
      # must boot without Stripe secrets; the checkout endpoint returns
      # stripe_not_configured at request time instead (Program.cs:355-377).
      SPECTR_REQUIRE_STRIPE: "0"
      SPECTR_REQUIRE_EMAIL: "1"
      Stripe__SecretKey: "${STRIPE_SECRET_KEY:-}"
      Stripe__WebhookSecret: "${STRIPE_WEBHOOK_SECRET:-}"
      Stripe__PriceProMonthly: "${STRIPE_PRICE_PRO_MONTHLY:-}"
      Stripe__PriceProAnnual: "${STRIPE_PRICE_PRO_ANNUAL:-}"
      Resend__ApiKey: "${RESEND_API_KEY:?}"
      Resend__WebhookSecret: "${RESEND_WEBHOOK_SECRET:?}"
      # Required (:?) — the onboarding@resend.dev sandbox sender in prod
      # would be a deliverability/DMARC disaster.
      Resend__FromAddress: "${RESEND_FROM:?}"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  # W1 — paid-priority pool (AR23): paid/credit analysis + coach + auxiliaries.
  worker-paid:
    image: ghcr.io/rankinbc/spectr-worker:${IMAGE_TAG:?}
    restart: unless-stopped
    logging: *default-logging
    environment: &worker-env
      DATABASE_URL: "postgresql+psycopg2://spectr:${POSTGRES_PASSWORD:?}@postgres:5432/spectr"
      REDIS_URL: "redis://redis:6379/0"
      TORCH_HOME: "/data/models"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:?}"
      LLM_FAKE: "0"
      S3_ENDPOINT: "${R2_ENDPOINT:?}"
      # AR21: worker-OWN scoped R2 token, never the BFF's.
      S3_ACCESS_KEY: "${R2_WORKER_ACCESS_KEY:?}"
      S3_SECRET_KEY: "${R2_WORKER_SECRET_KEY:?}"
      S3_BUCKET: "${R2_BUCKET:-spectr}"
      S3_REGION: "auto"
      RESEND_API_KEY: "${RESEND_API_KEY:?}"
      SPECTR_REQUIRE_EMAIL: "1"
      # Story 10.3 — metrics exporter (:9191, scraped internally) + Sentry.
      # PROMETHEUS_MULTIPROC_DIR MUST be set here (env, pre-import): the
      # dramatiq middleware only sets it in after_process_boot, which is
      # AFTER obs.py has imported prometheus_client — the value class binds
      # at import, and without this every metric (dramatiq's AND ours)
      # writes in-process only while the :9191 exporter serves the EMPTY
      # multiprocess registry (review CRITICAL).
      WORKER_METRICS: "1"
      PROMETHEUS_MULTIPROC_DIR: "/tmp/dramatiq-prometheus"
      prometheus_multiproc_dir: "/tmp/dramatiq-prometheus"
      dramatiq_prom_db: "/tmp/dramatiq-prometheus"
      dramatiq_prom_host: "0.0.0.0"
      dramatiq_prom_port: "9191"
      SENTRY_DSN: "${SENTRY_DSN_WORKER:-}"
      # LLM spend caps (worker/app/llm/budget.py resolves feature-flag first,
      # env fallback second; with credits off everyone is tier pro, so pro +
      # global ceilings are the live guards).
      LLM_BUDGET_GLOBAL_USD: "${LLM_BUDGET_GLOBAL_USD:-10}"
      LLM_BUDGET_PRO_USD: "${LLM_BUDGET_PRO_USD:-8}"
      # Queue reshape (D9) for the single-VM demo: worker-paid keeps coach
      # only so a chat reply never queues behind a running analysis.
      WORKER_QUEUES: "coach"
    volumes:
      - /opt/spectr/data:/data
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  # W2 — free/maintenance pool (FR34 starvation guarantee by PROCESS split).
  worker-free:
    image: ghcr.io/rankinbc/spectr-worker:${IMAGE_TAG:?}
    restart: unless-stopped
    logging: *default-logging
    environment:
      <<: *worker-env
      # Queue reshape (D9): worker-free now also drains analysis-paid so a
      # single-VM demo still processes on-demand specialists; trade-off
      # accepted per brief — they queue behind a running analysis here.
      WORKER_QUEUES: "analysis-paid analysis-free maintenance"
    volumes:
      - /opt/spectr/data:/data
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  # ── Story 10.3 — observability pair. Prometheus publishes NOTHING;
  # grafana binds 127.0.0.1 only (operator reaches it via SSH tunnel:
  # `ssh -L 3000:localhost:3000 <vps>` — no public surface pre-10.5).
  prometheus:
    image: prom/prometheus:v2.53.0
    restart: unless-stopped
    logging: *default-logging
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=30d"]
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

  grafana:
    image: grafana/grafana:11.1.0
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      # Defaults (NOT :?) — observability must never deploy-freeze the app
      # stack (review: a :? here fails EVERY compose command incl. the
      # auto-rollback path until the operator edits .env). Grafana binds
      # 127.0.0.1 only, so the changeme default is tunnel-reachable only;
      # runbook says set both properly + run the role SQL.
      GF_SECURITY_ADMIN_USER: "admin"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-changeme}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GRAFANA_PG_PASSWORD: "${GRAFANA_PG_PASSWORD:-}"  # read-only role (runbook SQL)
      # Story 10.4 — the alerting contact point interpolates this. The
      # default is deliberately UNROUTABLE (review: a guessable public
      # ntfy topic would receive business telemetry AND make delivery
      # look like it works) — misconfiguration fails loudly in Grafana's
      # notification log instead of succeeding silently into public space.
      NTFY_URL: "${NTFY_URL:-http://127.0.0.1:9/ntfy-unconfigured}"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      prometheus: { condition: service_started }

  # Story 10.4 — host metrics for the disk>80% alert (no other way to see
  # the host from inside the stack). Unpublished; prometheus scrapes :9100.
  node-exporter:
    image: prom/node-exporter:v1.8.1
    restart: unless-stopped
    logging: *default-logging
    command: ["--path.rootfs=/host"]
    volumes:
      - /:/host:ro,rslave
    pid: host

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: spectr
      POSTGRES_USER: spectr
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spectr"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *default-logging
    # AOF: dramatiq queues ARE durable state (NFR16 queued-jobs-survive).
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
