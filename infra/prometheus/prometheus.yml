# Story 10.3 — scrape config for the SPECTR prod stack (internal network
# only; prometheus publishes no port).
global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  - job_name: bff
    static_configs:
      - targets: ["bff:5000"]
  - job_name: worker-paid
    static_configs:
      - targets: ["worker-paid:9191"]
  - job_name: worker-free
    static_configs:
      - targets: ["worker-free:9191"]
